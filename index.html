<!DOCTYPE html>
<html>
<head>
    <title>Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="game-card">
            <h2>Typing Game</h2>
            <div id="passage"><div id="passage-inner">Loading quote...</div></div>
        </div>

        <div class="results-card">
            <h3>Result Section</h3>
            <p>Time: <span id="time-result">0</span> seconds</p>
            <p>WPM: <span id="wpm-result">0</span></p>
            <p>Correct Letters: <span id="correct-result">0</span></p>
            <p>Wrong Letters: <span id="wrong-result">0</span></p>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
