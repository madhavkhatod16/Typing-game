<!DOCTYPE html>
<html>
<head>
    <title>Typing Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #151720;
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            display: flex;
            gap: 25px;
            width: 900px;
            max-width: 95%;
        }

        .game-card, .results-card {
            background: #202330;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #35394a;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .game-card {
            flex: 2;
            min-width: 0;
        }

        .results-card {
            flex: 1;
            min-width: 240px;
        }

        .game-card:hover, .results-card:hover {
            border-color: #8b78ff;
        }

        h2 {
            font-size: 26px;
            color: #b5a5ff;
            margin-top: 0;
            margin-bottom: 12px;
        }

        h3 {
            font-size: 20px;
            color: #b5a5ff;
            margin-top: 0;
            margin-bottom: 22px;
        }

        #passage {
            font-size: 19px;
            line-height: 2;
            padding: 25px;
            margin-top: 25px;
            background: #171923;
            border: 1px solid #393d4f;
            border-radius: 12px;
            color: #c7cad5;
            overflow: hidden;
            position: relative;
            height: 80px;
            display: flex;
            align-items: center;
        }

        #passage-inner {
            padding-left: 50px;
            display: inline-block;
            position: absolute;
            left: 10px; 
            transition: transform 0.1s ease-out;
            white-space: nowrap;
        }

        .correct {
            color: #4ade80;
        }

        .wrong {
            color: #ff647c;
            background: #44232d;
            border-radius: 3px;
        }

        .results-card p {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #bfc3d1;
            margin: 15px 0;
            padding: 15px;
            background: #292d3c;
            border: 1px solid transparent;
            border-radius: 9px;
            transition: 0.3s;
        }

        .results-card p:hover {
            background: #35394b;
            border-color: #4a4f65;
            transform: translateX(3px);
        }

        .results-card p span {
            color: #4ade80;
            font-size: 19px;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-card">
            <h2>Typing Game</h2>
            <div id="passage"><div id="passage-inner">Loading quote...</div></div>
        </div>

        <div class="results-card">
            <h3>Result Section</h3>
            <p>Time: <span id="time-result">0</span> seconds</p>
            <p>WPM: <span id="wpm-result">0</span></p>
            <p>Correct Letters: <span id="correct-result">0</span></p>
            <p>Wrong Letters: <span id="wrong-result">0</span></p>
        </div>
    </div>

<script>
let quote = "";
let typed = "";
let startTime = null;
let timer = null;
let isPlaying = false;
let gameStarted = false;

let correct = 0;
let wrong = 0;
let seconds = 0;

const list = [
    "Practice typing every day to improve your speed and accuracy.",
    "Learning JavaScript is fun when you build small interactive projects.",
    "Keep practicing consistently and never stop learning new things."
];

let index = 0;
let nextQuoteCache = null;

async function fetchQuote() {
    let text = "";
    try {
        let res = await fetch("https://dummyjson.com/quotes/random");
        let data = await res.json();
        text = data.quote;
    } catch (err) {
        text = list[index];
        index = (index + 1) % list.length;
    }
    return text;
}

async function init() {
    let first;
    if (nextQuoteCache) {
        first = nextQuoteCache;
    } else {
        first = await fetchQuote();
    }
    
    let second = await fetchQuote();
    quote = first + " " + second;
    typed = "";
    correct = 0;
    wrong = 0;
    seconds = 0;
    gameStarted = false;
    isPlaying = true;

    document.getElementById("correct-result").innerText = 0;
    document.getElementById("wrong-result").innerText = 0;
    document.getElementById("time-result").innerText = 0;
    document.getElementById("wpm-result").innerText = 0;

    render();
    nextQuoteCache = await fetchQuote();
}

function render() {
    let html = "";
    for (let i = 0; i < quote.length; i++) {
        if (i < typed.length) {
            if (typed[i] === quote[i]) {
                html += `<span class="correct">${quote[i]}</span>`;
            } else {
                html += `<span class="wrong">${quote[i]}</span>`;
            }
        } else {
            html += `<span>${quote[i]}</span>`;
        }
    }
    
    let innerDiv = document.getElementById("passage-inner");
    innerDiv.innerHTML = html;

    let spans = innerDiv.querySelectorAll("span");
    let offset = 0;
    if (typed.length > 0 && typed.length <= spans.length) {
        let currentSpan = spans[typed.length - 1];
        offset = currentSpan.offsetLeft - 50;
        if (offset < 0) offset = 0;
    }
    innerDiv.style.transform = `translateX(-${offset}px)`;
}

function stopGame() {
    isPlaying = false;
    clearInterval(timer);

    if (seconds > 0) {
        let mins = seconds / 60;
        let wpm = Math.round((correct / 5) / mins);
        document.getElementById("wpm-result").innerText = wpm;
    } else {
        document.getElementById("wpm-result").innerText = 0;
    }
}

window.addEventListener("keydown", async function (e) {
    if (!isPlaying) return;

    if (!gameStarted) {
        gameStarted = true;
        startTime = Date.now();
        timer = setInterval(function () {
            seconds = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById("time-result").innerText = seconds;
        }, 1000);
    }

    if (e.key === "Backspace") {
        if (typed.length > 0) {
            let last = typed[typed.length - 1];

            if (last === quote[typed.length - 1]) {
                correct = Math.max(0, correct - 1);
            } else {
                wrong = Math.max(0, wrong - 1);
            }

            typed = typed.slice(0, -1);
        }
    } else if (e.key.length === 1) {
        if (e.key === " ") {
            e.preventDefault();
        }

        let pos = typed.length;

        if (pos < quote.length) {
            if (e.key === quote[pos]) {
                correct++;
            } else {
                wrong++;
            }

            typed += e.key;
        }
    } else {
        return;
    }

    document.getElementById("correct-result").innerText = correct;
    document.getElementById("wrong-result").innerText = wrong;

    render();

    if (typed.length === quote.length) {
        stopGame();
        setTimeout(async () => {
            await init();
        }, 1500);
        return;
    }

    let left = quote.length - typed.length;
    if (left <= 20 && nextQuoteCache) {
        let next = nextQuoteCache;
        quote += " " + next;
        render();
        nextQuoteCache = await fetchQuote();
    }
});

init();
</script>
</body>
</html>
